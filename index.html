<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volcano Eruption Simulation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="simCanvas"></canvas>
    
    <div class="control-panel">
        <h1>Volcano Control</h1>
        
        <div class="control-group">
            <button id="eruptBtn" class="primary-btn">Erupt!</button>
        </div>
        
        <div class="control-group">
            <label for="speedSlider">Time Speed (<span id="speedValue">1.0</span>x)</label>
            <input type="range" id="speedSlider" min="0.05" max="2" step="0.05" value="1.0">
        </div>
        
        <div class="control-group">
            <label for="particleSlider">Intensity (<span id="particleValue">500</span>)</label>
            <input type="range" id="particleSlider" min="100" max="2000" step="100" value="500">
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
